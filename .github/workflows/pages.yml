# Publica el repositorio en GitHub Pages:
#   https://nicfro40.github.io/Proyectosnico/            → sitio HIDROTEKA
#   https://nicfro40.github.io/Proyectosnico/dj-system/  → MIXDECK
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/dj-system-c2iwym]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
